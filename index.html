<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMS DASH Player</title>
<style>
body{font:17px system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#111827;color:#f9fafb}video{width:100%;background:#000}a{color:#93c5fd}#status{min-height:1.5em}
select{font:inherit;padding:8px;background:#1f2937;color:#fff;border:1px solid #6b7280;border-radius:6px}label{margin-right:10px}
</style>
</head>
<body>
<h1>AMS DASH Player</h1>
<video id="video" controls playsinline preload="metadata"></video>
<p><label for="quality">Video bitrate</label><select id="quality" disabled><option value="auto">Automatic</option></select></p>
<p id="current-quality" aria-live="polite">Current bitrate: waiting for video…</p>
<p id="status" role="status">Loading player…</p>
<p><a href="manifest.mpd">DASH manifest</a> · Five video qualities and an audio track. Press play to begin.</p>
<p>For an external DASH player, use: <a id="manifest"></a></p>
<script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>
<script>
const url = new URL('manifest.mpd', location.href).href;
const link = document.getElementById('manifest');
link.href = url; link.textContent = url;
const status = document.getElementById('status');
if (!window.dashjs) {
  status.textContent = 'Could not load the player library. Check your connection and reload.';
} else {
  const player = dashjs.MediaPlayer().create();
  const quality = document.getElementById('quality');
  const currentQuality = document.getElementById('current-quality');
  let bitrates = [];
  function bitrateLabel(info) {
    return info.bitrate >= 1000000
      ? `${info.bitrate / 1000000} Mbps`
      : `${info.bitrate / 1000} kbps`;
  }
  function showCurrentQuality(index) {
    const info = bitrates.find(item => item.qualityIndex === index);
    if (info) currentQuality.textContent = `Current bitrate: ${bitrateLabel(info)}`;
  }
  player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function () {
    bitrates = player.getBitrateInfoListFor('video');
    quality.replaceChildren(new Option('Automatic', 'auto'));
    bitrates.forEach(info => quality.add(new Option(bitrateLabel(info), String(info.qualityIndex))));
    quality.disabled = false;
    showCurrentQuality(player.getQualityFor('video'));
  });
  quality.addEventListener('change', function () {
    const automatic = quality.value === 'auto';
    player.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: automatic } } } });
    if (!automatic) {
      player.setQualityFor('video', Number(quality.value), true);
      status.textContent = 'Switching bitrate…';
    } else {
      status.textContent = 'Automatic bitrate selection enabled.';
    }
  });
  player.on(dashjs.MediaPlayer.events.QUALITY_CHANGE_RENDERED, function (event) {
    if (event.mediaType === 'video') {
      showCurrentQuality(event.newQuality);
      status.textContent = 'Playing';
    }
  });
  player.on(dashjs.MediaPlayer.events.ERROR, function () {
    status.textContent = 'Playback error. Check that this browser supports MPEG-DASH and that the media files are reachable.';
  });
  document.getElementById('video').addEventListener('playing', function () {
    status.textContent = 'Playing';
  });
  player.initialize(document.getElementById('video'), url, false);
  status.textContent = 'Ready — press play.';
}
</script>
</body>
</html>

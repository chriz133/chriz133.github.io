<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMS DASH Player</title>
<style>
body{font:17px system-ui,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#111827;color:#f9fafb}video{width:100%;background:#000}a{color:#93c5fd}#status{min-height:1.5em}
</style>
</head>
<body>
<h1>AMS DASH Player</h1>
<video id="video" controls playsinline preload="metadata"></video>
<p id="status" role="status">Loading player…</p>
<p><a href="manifest.mpd">DASH manifest</a> · Five video qualities and an audio track. Press play to begin.</p>
<p>For an external DASH player, use: <a id="manifest"></a></p>
<script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>
<script>
const url = new URL('manifest.mpd', location.href).href;
const link = document.getElementById('manifest');
link.href = url; link.textContent = url;
const status = document.getElementById('status');
if (!window.dashjs) {
  status.textContent = 'Could not load the player library. Check your connection and reload.';
} else {
  const player = dashjs.MediaPlayer().create();
  player.on(dashjs.MediaPlayer.events.ERROR, function () {
    status.textContent = 'Playback error. Check that this browser supports MPEG-DASH and that the media files are reachable.';
  });
  document.getElementById('video').addEventListener('playing', function () {
    status.textContent = 'Playing';
  });
  player.initialize(document.getElementById('video'), url, false);
  status.textContent = 'Ready — press play.';
}
</script>
</body>
</html>
